services:
  orbit:
    # Pin a release or digest. The update script records the pulled digest in .env.
    image: '${ORBIT_IMAGE:-ghcr.io/mattz1337/orbit:0.2.0}'
    platform: linux/amd64
    init: true
    restart: unless-stopped
    # Choose a NAS user/group with write access to DATA_PATH.
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    ports:
      # Loopback by default; set APP_BIND_IP to the NAS's private IP for direct LAN access.
      - '${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-4310}:4310'
    environment:
      ACCESS_MODE: password
      APP_ORIGIN: '${APP_ORIGIN:?Set the app origin in .env}'
      ALLOW_LAN_HTTP: '${ALLOW_LAN_HTTP:-false}'
      OWNER_PASSWORD_HASH_FILE: /run/secrets/owner-password.json
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: '4310'
      SEED_DEMO: 'false'
      EMBEDDINGS: '${EMBEDDINGS:-local}'
      EMBEDDING_THREADS: '2'
      EXTRACTION: extractive
      # Optional exact proxy addresses; empty avoids trusting forwarded headers.
      TRUST_PROXY: '${TRUST_PROXY:-}'
      TZ: Europe/Berlin
    volumes:
      - '${DATA_PATH:-/volume1/docker/orbit/data}:/data'
      - '${PASSWORD_HASH_PATH:-/volume1/docker/orbit/secrets/owner-password.json}:/run/secrets/owner-password.json:ro'
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Some DSM kernels lack CFS CPU quota support. Bound local inference threads instead.
    mem_limit: 2g
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
